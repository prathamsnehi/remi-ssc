name: Update Dashboard & Versioning

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  dashboard-and-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Semantic Versioning and Tagging
        id: versioning
        run: |
          # Get the latest tag, default to 1.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          # Remove 'v' prefix if present for calculation
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a PARTS <<< "$VERSION"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if [[ "$COMMIT_MSG" == *"feat"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
            echo "Bumping minor version."
          elif [[ "$COMMIT_MSG" == *"bug"* ]] || [[ "$COMMIT_MSG" == *"chore"* ]]; then
            PATCH=$((PATCH + 1))
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
            echo "Bumping patch version."
          else
            echo "No version bump keyword found. Skipping tagging."
            NEW_TAG=""
          fi

          if [[ -n "$NEW_TAG" ]]; then
            echo "New version: $NEW_TAG"
            echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
            
            # Configure git
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            
            git tag $NEW_TAG
            git push origin $NEW_TAG
          fi

      - name: Update Dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/update_dashboard.py

          # Check for changes
          if [[ -n $(git status -s docs/non-technical/dashboard.md) ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add docs/non-technical/dashboard.md
            git commit -m "chore: update dashboard stats [skip ci]"
            git push
          else
            echo "No changes to dashboard."
          fi
